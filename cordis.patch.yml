# dsh-enough bundle patch.
#
# Default install = COEXIST mode: the plugin only registers the
# `context_index` / `enough_status` tools and the `/enough` command. It does
# NOT touch the compaction backend, so it can sit next to any other compressor.
#
# Switch to TAKEOVER mode at runtime with `/enough mode takeover`; that swaps
# the live compaction engine's summarizer for the handoff summarizer with no
# restart. Takeover is runtime-only on purpose: the engine config is frozen at
# startup, so this patch deliberately pins no engine limits.
- insert:
    - id: enough
      name: dsh-enough
      config:
        mode: coexist
