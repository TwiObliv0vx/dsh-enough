# dsh-enough bundle patch.
#
# Default install = COEXIST mode: the plugin only registers the
# `context_index` / `enough_status` tools and the `/enough` command. It does
# NOT touch the compaction backend, so it can sit next to billion-context.
#
# Switch to TAKEOVER mode at runtime with `/enough mode takeover`; that swaps
# the live compaction engine's summarizer for the handoff summarizer without
# restarting anything. To make takeover persist across restarts, add this row
# to the same patch (see README "Takeover"):
#
#   - id: compaction-basic
#     config:
#       thresholdRatio: 0.55
#       retainRatio: 0.12
- insert:
    - id: enough
      name: dsh-enough
      config:
        mode: coexist
